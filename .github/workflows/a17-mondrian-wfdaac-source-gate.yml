name: AOSP17 mondrian WFD AAC source safety
on:
  push:
    branches:
      - port/a17-mondrian-wfdaac-ownership-buffers-20261108
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-encoder-and-packaging-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: C++17 source encoding mock, ASan/UBSan and GNU Make platform guards
        run: python3 tests/check_android17_mondrian_wfdaac.py
      - name: Pin and verify AOSP17 manifest, WFD AAC guard, and project matrix
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch port/a17-aosp17-manifest-20261102 \
            https://github.com/PixelExperience-Reborn/manifest.git "$RUNNER_TEMP/pe-a17-manifest"
          cd "$RUNNER_TEMP/pe-a17-manifest"
          test "$(git rev-parse HEAD)" = "4fe8c829d8c2a80ed7828bcd049cab59d8d1d8de"
          python3 tools/validate_aosp17_base_profiles.py
          python3 -m unittest discover -s tools -p test_aosp17_manifest_entrypoint.py -v
          python3 tools/validate_135_repository_matrix.py
      - name: Scope
        run: |
          echo "Source-only: no actual Fraunhofer codec test, Soong Android17 build, WFD video or physical mondrian."
          echo "Miracast requires separately audited Xiaomi WfdCommon/HDCP/VDS/MediaCodec binaries."
